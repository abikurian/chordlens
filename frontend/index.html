<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>ChordLens</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=20261112k" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#top" id="brand-home-btn" class="brand-link" aria-label="ChordLens">
        <img src="/logo.svg" alt="" class="brand-logo" width="28" height="28" />
        <span class="brand-name">ChordLens</span>
      </a>
      <div class="topbar-actions">
        <button type="button" id="settings-btn" class="btn btn-secondary btn-sm settings-trigger" aria-expanded="false" aria-controls="settings-drawer">
          Settings
          <span id="settings-dot" class="settings-dot" hidden aria-label="Custom settings active"></span>
        </button>
        <div class="export-menu-wrap">
          <button type="button" id="export-btn" class="btn btn-secondary btn-sm" aria-expanded="false" aria-haspopup="menu" disabled>
            Export
          </button>
          <div id="export-menu" class="export-menu" role="menu" hidden>
            <button type="button" id="export-txt-btn" class="export-menu-item" role="menuitem">Export chord sheet (.txt)</button>
            <button type="button" id="export-json-btn" class="export-menu-item" role="menuitem">Export JSON (.json)</button>
          </div>
        </div>
      </div>
    </div>
    <p id="song-summary" class="song-summary" hidden></p>
  </header>

  <main class="workspace">
    <section id="input-view" class="input-view" aria-label="Analyze a song">
      <p class="input-lead">Drop an audio file or paste a YouTube link to see its chords.</p>

      <div class="input-grid">
        <form id="upload-form" class="input-block">
          <label for="audio-file" class="field-label">Audio file</label>
          <div class="input-row">
            <input type="file" id="audio-file" name="file" accept="audio/*,.mp3,.wav,.flac,.m4a,.ogg" class="file-input" required />
            <button type="submit" id="upload-btn" class="btn btn-primary">Analyze</button>
          </div>
          <p id="selected-file-name" class="selected-file-name" hidden></p>
        </form>

        <form id="url-form" class="input-block">
          <label for="youtube-url" class="field-label">YouTube link</label>
          <div class="input-row">
            <input type="url" id="youtube-url" name="url" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="https://www.youtube.com/watch?v=..." class="text-input" required />
            <div class="url-actions">
              <button type="button" id="paste-url-btn" class="btn btn-secondary">Paste</button>
              <button type="submit" id="url-btn" class="btn btn-primary">Analyze</button>
            </div>
          </div>
        </form>
      </div>

      <div class="input-options-wrap">
        <button type="button" id="input-options-btn" class="text-toggle-btn" aria-expanded="false" aria-controls="input-options-panel">
          Options
        </button>
        <div id="input-options-panel" class="input-options-panel" hidden>
          <fieldset class="mode-fieldset">
            <legend class="field-label">Analysis mode</legend>
            <label class="mode-option">
              <input type="radio" name="analysis-mode" value="fast" checked />
              <span>Fast (full mix)</span>
            </label>
            <label class="mode-option">
              <input type="radio" name="analysis-mode" value="accurate" />
              <span>Accurate (stems + neural chord model)</span>
            </label>
          </fieldset>
          <div class="options-extra-row">
            <label for="yt-cookies-select" class="field-label">YouTube cookies (personal use)</label>
            <select id="yt-cookies-select" class="capo-select-inline">
              <option value="">Off (default)</option>
              <option value="chrome">Chrome</option>
              <option value="edge">Edge</option>
              <option value="firefox">Firefox</option>
              <option value="brave">Brave</option>
            </select>
          </div>
        </div>
      </div>

      <p id="status-banner" class="status-line" role="status" aria-live="polite" hidden></p>
    </section>

    <section id="results-view" class="results-view" aria-label="Chord chart" hidden>
      <audio id="audio-player" preload="metadata"></audio>

      <div id="player-dock" class="player-dock">
        <section id="now-playing-strip" class="now-playing-strip" aria-label="Now playing">
        <div class="np-main-row">
          <button type="button" id="np-current-btn" class="np-current-btn" aria-haspopup="dialog" title="Tap for alternate guitar shapes">
            <div class="np-chord-text">
              <span class="np-caption">Now</span>
              <strong id="now-playing-chord" class="now-playing-chord">—</strong>
              <span id="np-simplified-tag" class="np-simplified-tag" hidden>simplified</span>
            </div>
            <div id="np-current-diagram" class="np-diagram"></div>
          </button>

          <button type="button" id="np-next-btn" class="np-next-btn" title="Tap to jump to next chord">
            <div class="np-chord-text">
              <span class="np-caption">Next</span>
              <strong id="now-playing-next-chord" class="now-playing-next-chord">—</strong>
              <span id="now-playing-countdown" class="now-playing-countdown"></span>
            </div>
            <div id="np-next-diagram" class="np-diagram np-diagram-sm"></div>
          </button>
        </div>

        <div id="chord-lane-viewport" class="chord-lane-viewport" aria-label="Upcoming chords timeline">
          <div id="lane-playhead" class="lane-playhead" aria-hidden="true"></div>
          <div id="chord-lane-track" class="chord-lane-track"></div>
        </div>

        <div class="np-progress-row">
          <div id="np-beat-dots" class="np-beat-dots" aria-label="Beat in bar">
            <span class="beat-dot" data-beat="0">1</span>
            <span class="beat-dot" data-beat="1">2</span>
            <span class="beat-dot" data-beat="2">3</span>
            <span class="beat-dot" data-beat="3">4</span>
          </div>
          <div class="np-bar-progress-track" aria-hidden="true">
            <div id="np-bar-progress" class="np-bar-progress-fill"></div>
          </div>
          <span id="np-time-readout" class="np-time-readout">0:00 / 0:00</span>
        </div>

        <div class="np-transport-row">
          <button type="button" id="np-prev-bar-btn" class="btn btn-secondary np-bar-step-btn" aria-label="Previous bar">Prev</button>
          <button type="button" id="np-play-btn" class="btn btn-primary np-play-btn">Play</button>
          <button type="button" id="np-next-bar-btn" class="btn btn-secondary np-bar-step-btn" aria-label="Next bar">Next</button>
          <input type="range" id="np-seek-slider" class="np-seek-slider" min="0" max="1000" value="0" aria-label="Seek audio position" />
          <button type="button" id="jump-to-bar-btn" class="btn btn-secondary btn-sm" hidden>Current bar</button>
        </div>
      </section>

      <div id="key-strip" class="key-strip" aria-label="Transpose and capo">
        <div class="key-strip-group" role="group" aria-label="Transpose">
          <span class="key-strip-label">Transpose</span>
          <button type="button" id="transpose-down-btn" class="key-step-btn" aria-label="Transpose down one semitone">-</button>
          <span id="transpose-val" class="transpose-val">0</span>
          <button type="button" id="transpose-up-btn" class="key-step-btn" aria-label="Transpose up one semitone">+</button>
          <span id="resulting-key" class="key-strip-key">—</span>
        </div>

        <div class="key-strip-group">
          <label for="capo-select" class="key-strip-label">Capo</label>
          <select id="capo-select" class="capo-select-inline">
            <option value="0">None</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
          </select>
          <button type="button" id="suggest-capo-btn" class="key-link-btn">Suggest</button>
          <button type="button" id="transpose-reset-btn" class="key-link-btn" hidden>Reset</button>
        </div>
      </div>

        <div id="capo-suggestion" class="capo-suggestion" hidden>
          <span id="capo-suggestion-text"></span>
          <button type="button" id="apply-capo-btn" class="key-link-btn">Apply</button>
        </div>
      </div>

      <div id="chart-scroll" class="chart-scroll">
        <div id="chord-popover" class="chord-popover" role="dialog" aria-modal="false" aria-labelledby="popover-title" hidden>
          <div class="popover-head">
            <div>
              <h2 id="popover-title" class="popover-title">—</h2>
              <p id="popover-notes" class="popover-notes"></p>
            </div>
            <button type="button" id="popover-close-btn" class="btn btn-secondary btn-sm">Close</button>
          </div>
          <div id="popover-shapes" class="popover-shapes"></div>
        </div>

        <div id="follow-teleprompter" class="follow-teleprompter" aria-label="Follow mode teleprompter" hidden></div>

        <p id="beat-grid-note" class="beat-grid-note" hidden></p>
        <p id="beat-grid-detail" class="beat-grid-detail" hidden></p>
        <div id="section-strip" class="section-strip" aria-label="Estimated song sections" hidden></div>
        <div id="lead-sheet" class="lead-sheet" hidden></div>
      </div>
    </section>
  </main>

  <div id="settings-backdrop" class="settings-backdrop" hidden></div>
  <aside id="settings-drawer" class="settings-drawer" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
    <div class="settings-head">
      <h2 id="settings-title" class="settings-title">Settings</h2>
      <button type="button" id="settings-close-btn" class="btn btn-secondary btn-sm" aria-label="Close settings">Close</button>
    </div>

    <div class="settings-body">
      <section class="settings-group" aria-labelledby="settings-chords-heading">
        <h3 id="settings-chords-heading" class="settings-group-title">Chords</h3>
        <div class="settings-control-row">
          <button type="button" id="chord-detail-btn" class="btn btn-secondary btn-sm" aria-pressed="false">Chords: Simple</button>
          <button type="button" id="guitar-shapes-btn" class="btn btn-secondary btn-sm" aria-pressed="true">Guitar shapes: On</button>
        </div>
        <div class="settings-control-row">
          <button type="button" id="view-shapes-btn" class="btn btn-secondary btn-sm" aria-pressed="true" disabled>Show: Shapes to play</button>
        </div>
      </section>

      <section class="settings-group" aria-labelledby="settings-practice-heading">
        <h3 id="settings-practice-heading" class="settings-group-title">Practice</h3>
        <div class="settings-control-row">
          <span class="settings-label">Speed</span>
          <div class="speed-group" role="group" aria-label="Playback speed">
            <button type="button" class="btn btn-secondary btn-sm speed-btn" data-speed="0.5" aria-pressed="false">0.5x</button>
            <button type="button" class="btn btn-secondary btn-sm speed-btn" data-speed="0.75" aria-pressed="false">0.75x</button>
            <button type="button" class="btn btn-secondary btn-sm speed-btn" data-speed="1" aria-pressed="true">1x</button>
          </div>
        </div>
        <div class="settings-control-row">
          <button type="button" id="np-loop-btn" class="btn btn-secondary btn-sm" aria-pressed="false">Loop 4 bars</button>
          <button type="button" id="follow-mode-btn" class="btn btn-secondary btn-sm" aria-pressed="false">Follow mode</button>
        </div>
        <div class="settings-control-row">
          <span class="settings-label">Timing nudge</span>
          <div class="transpose-controls" role="group" aria-label="Timing nudge">
            <button type="button" id="nudge-down-btn" class="btn btn-secondary btn-sm btn-icon" aria-label="Nudge timing 10 milliseconds earlier">-</button>
            <span id="nudge-val" class="transpose-val">0 ms</span>
            <button type="button" id="nudge-up-btn" class="btn btn-secondary btn-sm btn-icon" aria-label="Nudge timing 10 milliseconds later">+</button>
          </div>
        </div>
        <div class="settings-control-row">
          <label for="early-beats-select" class="settings-label">Show changes early</label>
          <select id="early-beats-select" class="capo-select-inline">
            <option value="0">On the beat</option>
            <option value="1" selected>1 beat early</option>
            <option value="2">2 beats early</option>
            <option value="3">3 beats early</option>
          </select>
        </div>
      </section>

      <section class="settings-group" aria-labelledby="settings-more-heading">
        <h3 id="settings-more-heading" class="settings-group-title">More</h3>
        <div class="settings-control-row">
          <button type="button" id="more-detail-btn" class="btn btn-secondary btn-sm" aria-pressed="false">Show details</button>
          <button type="button" id="edit-mode-btn" class="btn btn-secondary btn-sm" aria-pressed="false" disabled>Edit chords</button>
        </div>
        <div class="settings-control-row">
          <button type="button" id="new-song-btn" class="btn btn-secondary btn-sm" hidden>Analyze another song</button>
        </div>
      </section>

      <section class="settings-group" aria-labelledby="settings-about-heading">
        <h3 id="settings-about-heading" class="settings-group-title">About</h3>
        <p class="about-version-line">ChordLens v<span id="about-app-version">0.1.0</span></p>
        <div id="about-diagnostics" class="about-diagnostics"></div>
        <div class="settings-control-row">
          <button type="button" id="open-data-dir-btn" class="btn btn-secondary btn-sm">Open data folder</button>
          <button type="button" id="clear-cache-btn" class="btn btn-secondary btn-sm">Clear cache</button>
        </div>
        <div class="settings-control-row">
          <button type="button" id="update-ytdlp-btn" class="btn btn-secondary btn-sm">Update downloader</button>
        </div>
        <p id="cache-action-status" class="cache-action-status" hidden></p>
      </section>
    </div>
  </aside>

  <script src="/chordShapes.js?v=20261112k"></script>
  <script src="/app.js?v=20261112k"></script>
</body>
</html>
